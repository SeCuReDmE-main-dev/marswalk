name: MarsWalk CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Lint, Schema & Pack Integrity Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter and formatter check
        run: |
          ruff check .
          ruff format --check .

      - name: Verify Jezero v1 static pack SHA-256 integrity
        run: |
          python -m marswalk.middleware.cli verify-pack --site jezero

      - name: Run Pytest suite (including 500-request concurrency test)
        run: |
          pytest -q --tb=short
