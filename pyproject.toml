[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marswalk"
version = "0.1.0"
description = "MarsWalk — Multi-scale Martian terrain verification middleware, plithogenic EVA engine, and static data pack for NASA Space Apps 2026"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Jean-Sebastien Beaulieu" },
  { name = "Philippe Pierre" },
]
dependencies = [
  "pydantic>=2.6.0",
  "fastapi>=0.110.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
engine = [
  "rasterio>=1.3.0",
]
dev = [
  "pytest>=8.0.0",
  "hypothesis>=6.100.0",
  "SALib>=1.5.0",
  "ruff>=0.4.0",
  "httpx>=0.27.0",
  "uvicorn>=0.29.0",
  "rasterio>=1.3.0",
]

[project.scripts]
marswalk-cli = "marswalk.middleware.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
